<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Sophisticated Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" style="max-width: 900px;">
    <div class="nav">
      <h2 style="color: #38bdf8;">Admin Control Panel</h2>
      <div>
        <a href="/dashboard.html">My Dashboard</a>
        <a href="#" id="logoutBtn">Logout</a>
      </div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Habits</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>

    <!-- UPGRADED ADMIN MODAL: Matches User Dashboard -->
    <div id="userModal" style="display:none; margin-top: 2rem; padding: 1.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 12px; max-width: 1100px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
        <h3 id="modalTitle" style="color: #38bdf8;">Viewing Dashboard Data</h3>
        <button onclick="document.getElementById('userModal').style.display='none'" style="background: none; color: #ef4444; border: none; font-size: 1.2rem; cursor:pointer;">✕</button>
      </div>
      
      <div class="dashboard-grid">
        <div class="dashboard-column" style="padding: 1rem;">
          <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">Today's Task Progress</h4>
          <div style="position: relative; height: 200px; width: 100%; display: flex; justify-content: center;">
            <canvas id="adminPieChart"></canvas>
          </div>
        </div>

        <div class="dashboard-column" style="padding: 1rem;">
          <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">Today's Health Goals</h4>
          <div id="adminHealthMiniCharts" style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 2rem;"></div>
          
          <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">30-Day Growth</h4>
          <div style="position: relative; height: 220px; width: 100%;">
            <canvas id="adminBarChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="admin.js"></script>
</body>
</html>
