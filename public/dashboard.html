<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sophisticated Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .user-badge { display: flex; align-items: center; background: rgba(30, 41, 59, 0.8); padding: 0.4rem 1rem; border-radius: 50px; border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15); margin-right: 15px; }
    .user-badge-text { background: linear-gradient(135deg, #38bdf8, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.3rem; font-weight: 900; letter-spacing: 0.5px; text-transform: capitalize; }
    .dashboard-column { background: linear-gradient(145deg, #1e293b, #0f172a); padding: 1.8rem; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05); position: relative; }
    .dashboard-grid .dashboard-column:nth-child(1) { border-top: 5px solid #38bdf8; }
    .dashboard-grid .dashboard-column:nth-child(2) { border-top: 5px solid #34d399; }
    .custom-input { padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
  </style>
</head>
<body>
  <div class="card" style="max-width: 1100px; width: 95%;">
    <div class="nav">
      <h2 style="color: #38bdf8; margin: 0;">Sophisticated Tracker</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="user-badge"><span style="font-size: 1.2rem; margin-right: 8px;">👋</span><span id="userNameDisplay" class="user-badge-text"></span></div>
        <a href="/reminders.html" style="color: #a78bfa; font-weight: bold; text-decoration: none; margin-right: 15px; background: rgba(167,139,250,0.1); padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #a78bfa;">🔔 Reminders</a>
        <button id="weeklyReportBtn" style="background: #fbbf24; color: #0f172a; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">📅 Weekly</button>
        <button id="monthlyReportBtn" style="background: #34d399; color: #0f172a; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">📊 Monthly</button>
        <a href="/admin.html" id="adminLink" style="display:none; color: #38bdf8; text-decoration: none; margin-left: 5px;">Admin Panel</a>
        <a href="#" id="logoutBtn" style="color: #ef4444; text-decoration: none;">Logout</a>
      </div>
    </div>

    <form id="habitForm" style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; background: #1e293b; padding: 1rem; border-radius: 12px; border: 1px solid #334155;">
      <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
               <select id="presetHealth" class="custom-input" style="flex: 1; color: #34d399; font-weight: 500; cursor: pointer;" onchange="applyPreset(this.value, 'presetHealth')">
          <option value="">-- SELECT HEALTH METRIC --</option>
          <optgroup label="💧 Hydration & Nutrition">
            <option value="Water Intake|number|L|4">Water Intake (Min 4 L)</option>
            <option value="Protein Intake|number|grams|100">Protein Intake (Min 100g)</option>
            <option value="Calorie Deficit|number|kcal|500">Calorie Deficit (500 kcal)</option>
          </optgroup>
          <optgroup label="🏃‍♂️ Physical Fitness">
            <option value="Daily Steps|number|steps|10000">Daily Steps (Min 10,000)</option>
            <option value="Running|number|km|5">Running (Min 5 km)</option>
            <option value="Cycling|number|km|10">Cycling (Min 10 km)</option>
            <option value="Gym Workout|number|mins|60">Gym Workout (60 mins)</option>
          </optgroup>
          <optgroup label="🛌 Sleep & Mindfulness">
            <option value="Sleep Duration|number|hrs|8">Sleep Duration (Min 8 hrs)</option>
            <option value="Meditation|number|mins|15">Meditation (Min 15 mins)</option>
            <option value="Yoga|number|mins|30">Yoga (Min 30 mins)</option>
          </optgroup>
        </select>

        <select id="presetTasks" class="custom-input" style="flex: 1; color: #38bdf8; font-weight: 500; cursor: pointer;" onchange="applyPreset(this.value, 'presetTasks')">
          <option value="">-- SELECT DAILY TASK --</option>
          <optgroup label="🍳 Routines">
            <option value="Nutrient-Dense Breakfast|boolean||">Nutrient-Dense Breakfast</option>
            <option value="Early Dinner Wind-down|boolean||">Early Dinner Wind-down</option>
            <option value="5AM Wake Up|boolean||">5AM Wake Up</option>
            <option value="No Sugar Today|boolean||">No Sugar Today</option>
          </optgroup>
          <optgroup label="💻 Focus & Career">
            <option value="Deep Work Block|boolean||">Deep Work Block</option>
            <option value="Pomodoro Sprints|boolean||">Pomodoro Sprints</option>
            <option value="LeetCode Problem|boolean||">LeetCode Problem</option>
            <option value="GitHub Commit|boolean||">GitHub Commit</option>
          </optgroup>
          <optgroup label="📚 Learning & Growth">
            <option value="Book Reading Progression|boolean||">Book Reading Progression</option>
            <option value="Learn New Tech Concept|boolean||">Learn New Tech Concept</option>
            <option value="Journaling|boolean||">Journaling</option>
          </optgroup>
        </select>

      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <input type="text" id="habitInput" placeholder="Habit Name..." required class="custom-input" style="flex: 1; margin: 0;">
        <select id="habitType" class="custom-input" onchange="toggleNumberInputs(this.value === 'number')">
          <option value="boolean">Checkmark (Done)</option>
          <option value="number">Number (Quantity/Time)</option>
        </select>
        <input type="text" id="habitUnit" placeholder="Unit" class="custom-input" style="width: 100px; margin: 0; display: none;" />
        <input type="number" id="habitTarget" placeholder="Target" class="custom-input" style="width: 100px; margin: 0; display: none;" />
        <button type="submit" style="padding: 0.75rem 1.5rem; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">+ Add</button>
      </div>
    </form>

    <div class="dashboard-grid">
      <div class="dashboard-column">
        <h3 class="column-header">Daily Tasks (Checklist)</h3>
        <div id="booleanHabitList" class="custom-scroll" style="max-height: 250px; overflow-y: auto; overflow-x: hidden; margin-bottom: 1.5rem; padding-right: 15px;"></div>
        <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">Today's Task Progress</h4>
        <div style="position: relative; height: 200px; width: 100%; display: flex; justify-content: center;"><canvas id="pieChart"></canvas></div>
      </div>
      <div class="dashboard-column">
        <h3 class="column-header">Health Metrics (Dynamic Goals)</h3>
        <div id="numberHabitList" class="custom-scroll" style="max-height: 250px; overflow-y: auto; overflow-x: hidden; margin-bottom: 1.5rem; padding-right: 15px;"></div>
        <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">Today's Health Goals</h4>
        <div id="healthMiniCharts" style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 2rem;"></div>
        <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; text-align: center;">30-Day Growth</h4>
        <div style="position: relative; height: 220px; width: 100%;"><canvas id="lineChart"></canvas></div>
      </div>
    </div>
  </div>

  <div id="reportModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #38bdf8; border-radius: 20px; padding: 2.5rem; width: 90%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(56, 189, 248, 0.25); text-align: center; position: relative;">
      <button onclick="document.getElementById('reportModal').style.display='none'" style="position: absolute; top: 15px; right: 20px; background: none; border: none; color: #ef4444; font-size: 1.5rem; cursor: pointer;">✕</button>
      <h2 id="reportModalTitle" style="color: #f8fafc; font-size: 2rem; margin-bottom: 0.5rem; font-weight: 900;">Report Recap</h2>
      <p id="reportModalSubtitle" style="color: #94a3b8; margin-bottom: 2rem;">Here is your progress.</p>
      <div id="reportContent" style="display: flex; flex-direction: column; gap: 1rem; text-align: left; max-height: 60vh; overflow-y: auto; padding-right: 10px;" class="custom-scroll"></div>
      <button onclick="document.getElementById('reportModal').style.display='none'" style="margin-top: 2rem; width: 100%; padding: 0.8rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Keep Going!</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
