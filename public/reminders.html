<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders - Sophisticated Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0f0f1a; color: white; font-family: sans-serif;">
  <div style="max-width: 800px; margin: 40px auto; padding: 20px; background: #1a1a2e; border-radius: 10px;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Reminders Center 🔔</h2>
      <div>
        <button onclick="testEmail()" style="background: #20c997; color: #000; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">Test Email Connection</button>
        <a href="dashboard.html" style="color: #4dabf7; text-decoration: none;">Back to Dashboard</a>
      </div>
    </div>

    <!-- Form Section -->
    <div style="background: #11111f; padding: 20px; border-radius: 8px; border: 1px solid #333;">
      <h3 style="color: #4dabf7; margin-top: 0;">Create New Reminder</h3>
      
      <label style="color: #a3a3a3; font-size: 14px; display: block; margin-bottom: 5px;">Category</label>
      <select id="reminder-type" onchange="loadItems()" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #1a1a2e; color: white; border: 1px solid #333;">
        <option value="habit">Habit</option>
        <option value="task">Task</option>
        <option value="health">Health Metric</option>
      </select>

      <label style="color: #a3a3a3; font-size: 14px; display: block; margin-bottom: 5px;">Select Item</label>
      <select id="item-dropdown" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #1a1a2e; color: white; border: 1px solid #333;">
        <option value="">-- Choose Item --</option>
      </select>

      <label style="color: #a3a3a3; font-size: 14px; display: block; margin-bottom: 5px;">Start Time</label>
      <input type="time" id="start-time" required style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; background: #1a1a2e; color: white; border: 1px solid #333;">

      <button onclick="saveReminder()" style="width: 100%; padding: 12px; background: #4dabf7; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Save Reminder</button>
    </div>
  </div>

 <script>
  let allHabits = [];

  // 1. Fetch all user habits when page loads
  async function loadItems() {
    const dropdown = document.getElementById('item-dropdown');
    dropdown.innerHTML = '<option value="">Loading...</option>';

    try {
      const res = await fetch('/api/habits', {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
      });
      
      if (!res.ok) throw new Error('Failed to fetch items');
      allHabits = await res.json();
      
      filterDropdownItems();
    } catch (err) {
      console.error("Error loading items:", err);
      dropdown.innerHTML = '<option value="">No items found</option>';
    }
  }

  // 2. Filter items based on Category
  function filterDropdownItems() {
    const category = document.getElementById('reminder-type').value;
    const dropdown = document.getElementById('item-dropdown');
    
    let filtered = allHabits;
    
    if (category === 'task') {
      filtered = allHabits.filter(h => h.type === 'boolean' || h.target === null);
    } else if (category === 'health') {
      filtered = allHabits.filter(h => h.type === 'number' || h.target > 0);
    }

    if (filtered.length > 0) {
      dropdown.innerHTML = '<option value="">-- Choose Item --</option>';
      filtered.forEach(item => {
        const option = document.createElement('option');
        option.value = item.id;
        option.textContent = item.title || item.name;
        dropdown.appendChild(option);
      });
    } else {
      dropdown.innerHTML = '<option value="">No items found</option>';
    }
  }

  document.getElementById('reminder-type').addEventListener('change', filterDropdownItems);

  // 3. Save the reminder
  async function saveReminder() {
    const categorySelect = document.getElementById('reminder-type');
    const item_type = categorySelect.options[categorySelect.selectedIndex].text;
    const item_id = document.getElementById('item-dropdown').value;
    const start_time = document.getElementById('start-time').value;

    if (!item_id || !start_time) {
      alert("Please select an item and time.");
      return;
    }

    try {
      const res = await fetch('/api/reminders', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify({ item_type, item_id, start_time })
      });
      
      if (res.ok) {
        alert('Reminder saved successfully!');
        loadSavedReminders();
      } else {
        const data = await res.json();
        alert('Error: ' + (data.error || 'Failed to save'));
      }
    } catch (err) {
      console.error(err);
    }
  }

  // 4. Test Email Connection
  async function testEmail() {
    try {
      const res = await fetch('/api/reminders/test-email', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
      });
      const data = await res.json();
      
      if(res.ok) {
        alert(data.message || 'SUCCESS! Check your inbox.');
      } else {
        alert('BREVO ERROR:\n' + (data.error || JSON.stringify(data)));
      }
    } catch (err) {
      console.error(err);
      alert('Network error connecting to email API.');
    }
  }

  // 5. Delete Reminder Function
  window.deleteReminder = async function(id) {
    if (!confirm('Are you sure you want to delete this reminder?')) return;
    try {
      const res = await fetch(`/api/reminders/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
      });
      if (res.ok) {
        loadSavedReminders(); // Instantly refresh the list
      } else {
        alert('Failed to delete reminder.');
      }
    } catch (err) {
      console.error(err);
    }
  };

  // 6. Fetch and display saved reminders with delete buttons
  async function loadSavedReminders() {
    try {
      const res = await fetch('/api/reminders', {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
      });
      if (!res.ok) return;
      const reminders = await res.json();

      let container = document.getElementById('savedRemindersBox');
      if (!container) {
        container = document.createElement('div');
        container.id = 'savedRemindersBox';
        container.style.marginTop = '30px';
        container.style.background = '#11111f';
        container.style.padding = '20px';
        container.style.borderRadius = '8px';
        container.style.border = '1px solid #333';
        document.querySelector('div[style*="max-width: 800px"]').appendChild(container);
      }

      container.innerHTML = `
        <h3 style="color: #4dabf7; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 8px;">Scheduled Reminders</h3>
        ${reminders.length > 0 ? reminders.map(r => `
          <div style="background: #1a1a2e; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222;">
            <span><strong style="color: #a78bfa;">${r.title || 'Item'}</strong> <span style="color: #888; font-size: 0.85rem;">(${r.item_type})</span></span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="color: #20c997; font-weight: bold; background: rgba(32, 201, 151, 0.1); padding: 4px 8px; border-radius: 4px;">🕒 ${r.start_time}</span>
              <button onclick="deleteReminder(${r.id})" style="background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; padding: 0 5px;" title="Delete Reminder">✕</button>
            </div>
          </div>
        `).join('') : '<p style="color: #888;">No reminders set yet.</p>'}
      `;
    } catch (err) {
      console.error(err);
    }
  }

  window.onload = () => {
    loadItems();
    loadSavedReminders();
  };
</script>


</body>
</html>
