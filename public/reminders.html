<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders - Sophisticated Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .custom-input { padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    .dashboard-column { background: linear-gradient(145deg, #1e293b, #0f172a); padding: 1.8rem; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6); }
    .dashboard-grid .dashboard-column:nth-child(1) { border-top: 5px solid #a78bfa; }
    .dashboard-grid .dashboard-column:nth-child(2) { border-top: 5px solid #f472b6; }
    .reminder-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="card" style="max-width: 1100px; width: 95%;">
    
    <div class="nav">
      <h2 style="color: #a78bfa; margin: 0;">Reminders Center 🔔</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="testEmailBtn" style="background: #34d399; color: #0f172a; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">Test Email Connection 🟢</button>
        <a href="/dashboard.html" style="color: #38bdf8; font-weight: bold; text-decoration: none; margin-left: 15px;">Back to Dashboard</a>
      </div>
    </div>
    
    <p id="testEmailResult" style="text-align: center; font-weight: bold; margin-bottom: 1rem;"></p>

    <div class="dashboard-grid">
      <!-- SET NEW REMINDER COLUMN -->
      <div class="dashboard-column">
        <h3 class="column-header" style="color: #a78bfa;">Create New Reminder</h3>
        
        <form id="reminderForm" style="display: flex; flex-direction: column; gap: 1.2rem; margin-top: 1.5rem;">
          <div>
            <label style="color: #94a3b8; font-size: 0.9rem;">Select Habit</label>
            <select id="habitSelect" class="custom-input" required style="width: 100%; margin-top: 5px;">
              <option value="">-- Choose a Habit --</option>
            </select>
          </div>
          
          <div>
            <label style="color: #94a3b8; font-size: 0.9rem;">Start Time</label>
            <div style="display: flex; gap: 8px; margin-top: 5px;">
              <input type="number" id="startHour" min="1" max="12" placeholder="HH" required class="custom-input" style="flex:1;" />
              <span style="color: #fff; align-self: center; font-weight: bold;">:</span>
              <input type="number" id="startMin" min="0" max="59" placeholder="MM" required class="custom-input" style="flex:1;" />
              <select id="startAmPm" class="custom-input" style="flex:1; cursor: pointer;">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
            </div>
          </div>

          <div id="repeatSettings" style="display: none; flex-direction: column; gap: 1.2rem;">
            <div>
              <label style="color: #94a3b8; font-size: 0.9rem;">How many times per day?</label>
              <input type="number" id="reminderCount" min="2" max="20" placeholder="e.g. 8 times" class="custom-input" style="width: 100%; margin-top: 5px; box-sizing: border-box;" />
            </div>
            <div>
              <label style="color: #94a3b8; font-size: 0.9rem;">Gap between emails</label>
              <div style="display: flex; gap: 8px; margin-top: 5px;">
                <input type="number" id="gapHours" min="0" max="23" placeholder="Hours" class="custom-input" style="flex:1;" />
                <input type="number" id="gapMins" min="0" max="59" placeholder="Minutes" class="custom-input" style="flex:1;" />
              </div>
            </div>
          </div>

          <button type="submit" style="margin-top: 1rem; width: 100%; padding: 0.8rem; background: #a78bfa; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Save Reminder</button>
        </form>
      </div>

      <!-- ACTIVE REMINDERS COLUMN -->
      <div class="dashboard-column">
        <h3 class="column-header" style="color: #f472b6;">Active Reminders</h3>
        <div id="activeRemindersList" style="margin-top: 1.5rem; max-height: 400px; overflow-y: auto;" class="custom-scroll">
          <p style="color: #94a3b8; text-align: center;">Loading active reminders...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="reminders.js"></script>
</body>
</html>
